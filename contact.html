<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - ShopEasy</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">ShopEasy.</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
            </ul>
        </div>
    </nav>

    <div class="container" style="padding: 4rem 1rem; max-width: 600px;">
        <h1 style="margin-bottom: 2rem; text-align: center;">Contact Us</h1>
        <div style="background: white; padding: 2rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);">
            <form onsubmit="event.preventDefault(); alert('Message sent successfully!'); this.reset();">
                <div class="form-group">
                    <label for="c-name">Name</label>
                    <input type="text" id="c-name" required>
                </div>
                <div class="form-group">
                    <label for="c-email">Email</label>
                    <input type="email" id="c-email" required>
                </div>
                <div class="form-group">
                    <label for="c-msg">Message</label>
                    <textarea id="c-msg" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
            </form>
        </div>
    </div>
</body>
</html>
