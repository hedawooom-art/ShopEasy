<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - ShopEasy</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">ShopEasy.</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
            </ul>
        </div>
    </nav>

    <div class="container" style="padding: 2rem 1rem;">
        <h1 style="margin-bottom: 2rem;">Shopping Cart</h1>
        
        <div class="cart-layout">
            <div id="cart-items-container" class="cart-items">
                <!-- Items loaded here -->
            </div>
            
            <div id="cart-summary-container" class="cart-summary" style="display: none;">
                <h3 style="margin-bottom: 1.5rem;">Order Summary</h3>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Discount (10% over $100)</span>
                    <span id="discount" style="color: var(--success)">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Delivery (Free over $50)</span>
                    <span id="delivery">$10.00</span>
                </div>
                <div class="summary-row summary-total">
                    <span>Total</span>
                    <span id="total">$0.00</span>
                </div>
                <a href="checkout.html" class="btn btn-primary" style="width: 100%; margin-top: 1.5rem;">Proceed to Checkout</a>
            </div>
        </div>
    </div>

    <script src="js/products.js"></script>
    <script src="js/script.js"></script>
    <script src="js/cart.js"></script>
</body>
</html>
