<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - ShopEasy</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">ShopEasy.</a>
            <form action="products.html" method="GET" class="search-bar">
                <input type="text" name="q" id="page-search" placeholder="Search products...">
                <button type="submit" style="background:none;border:none;cursor:pointer"><i class="fas fa-search" style="color: var(--text-light)"></i></button>
            </form>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="nav-icons">
                <a href="wishlist.html" class="icon">
                    <i class="fas fa-heart"></i>
                    <span class="badge" id="wishlist-badge" style="display: none;">0</span>
                </a>
                <a href="cart.html" class="icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="badge" id="cart-badge" style="display: none;">0</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="container" style="padding: 2rem 1rem;">
        <h1 style="margin-bottom: 2rem;">All Products</h1>
        
        <div class="filters-bar">
            <div class="filter-group">
                <label for="category-filter">Category:</label>
                <select id="category-filter">
                    <option value="All">All Categories</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Fashion">Fashion</option>
                    <option value="Footwear">Footwear</option>
                    <option value="Home & Living">Home & Living</option>
                    <option value="Accessories">Accessories</option>
                    <option value="Sports">Sports</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="sort-filter">Sort By:</label>
                <select id="sort-filter">
                    <option value="default">Default</option>
                    <option value="price-low">Price: Low to High</option>
                    <option value="price-high">Price: High to Low</option>
                    <option value="rating">Top Rated</option>
                    <option value="name">Name (A-Z)</option>
                </select>
            </div>
        </div>

        <div class="product-grid" id="products-grid">
            <!-- Populated by JS -->
        </div>
    </div>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2024 ShopEasy. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('products-grid');
            const catFilter = document.getElementById('category-filter');
            const sortFilter = document.getElementById('sort-filter');
            const searchInput = document.getElementById('page-search');
            
            // Get URL params
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('q');
            const categoryParam = urlParams.get('category');

            if (query) {
                searchInput.value = query;
            }
            if (categoryParam) {
                catFilter.value = categoryParam;
            }

            function renderFilteredProducts() {
                let filtered = [...products];
                
                // Search filter
                const searchTerm = searchInput.value.toLowerCase();
                if (searchTerm) {
                    filtered = filtered.filter(p => p.name.toLowerCase().includes(searchTerm) || p.description.toLowerCase().includes(searchTerm));
                }

                // Category filter
                const category = catFilter.value;
                if (category !== 'All') {
                    filtered = filtered.filter(p => p.category === category);
                }

                // Sorting
                const sort = sortFilter.value;
                if (sort === 'price-low') filtered.sort((a, b) => a.price - b.price);
                else if (sort === 'price-high') filtered.sort((a, b) => b.price - a.price);
                else if (sort === 'rating') filtered.sort((a, b) => b.rating - a.rating);
                else if (sort === 'name') filtered.sort((a, b) => a.name.localeCompare(b.name));

                if (filtered.length === 0) {
                    grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 2rem;">No products found.</div>';
                } else {
                    grid.innerHTML = filtered.map(p => createProductCard(p)).join('');
                }
            }

            catFilter.addEventListener('change', renderFilteredProducts);
            sortFilter.addEventListener('change', renderFilteredProducts);
            searchInput.addEventListener('input', renderFilteredProducts);
            
            renderFilteredProducts();
        });
    </script>
</body>
</html>
